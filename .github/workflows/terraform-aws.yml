name: Terraform (AWS)

on:
  pull_request:
    branches: [main]
    types: [closed]
    paths:
      # Deliberately not a blanket infrastructure/aws/**: bootstrap/ stays
      # a manual, local, one-time step (it creates the state backend and
      # the OIDC role this workflow assumes) and should never auto-apply.
      - "infrastructure/aws/live/**"
      - "infrastructure/aws/modules/**"

permissions:
  id-token: write
  contents: read

jobs:
  terraform:
    runs-on: ubuntu-latest
    if: github.event.pull_request.merged == true
    environment: aws-infra
    defaults:
      run:
        working-directory: infrastructure/aws/live/prod
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_TERRAFORM_ROLE_ARN }}
          aws-region: us-west-2

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4

      - name: Terraform init
        run: terraform init -input=false -backend-config=backend.hcl

      - name: Mask webhook URL
        # The repo is public, so apply logs are world-readable. The provider
        # doesn't mark aws_amplify_webhook.url sensitive, so an apply touching
        # the webhook could print it. See terraform-aws-plan.yml.
        run: |
          url=$(terraform output -raw webhook_url 2>/dev/null || true)
          if [ -n "$url" ]; then echo "::add-mask::$url"; fi

      - name: Terraform apply
        # profile="" disables the local-named-profile default (OTS-Prod-Deploy);
        # CI authenticates via the OIDC role assumed above instead.
        # github_access_token: the Amplify CreateApp API always needs an
        # explicit GitHub token, even with the Amplify GitHub App already
        # authorized in the console - see infrastructure/aws/modules/amplify/main.tf.
        env:
          TF_VAR_github_access_token: ${{ secrets.AMPLIFY_GITHUB_TOKEN }}
        run: terraform apply -input=false -auto-approve -var profile=""
