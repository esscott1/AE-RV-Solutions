name: Chatbot knowledge base sync

# Publishes the repo's knowledge-base/ folder to the chatbot.
#
# 1. Mirrors knowledge-base/ into the private documents bucket
#    (ae-rv-chatbot-kb-docs-<account>). This is an exact mirror, deletions
#    included, so the repo is the single source of truth: files uploaded to
#    the bucket by hand are removed on the next run.
# 2. Re-indexes the knowledge base (a Bedrock ingestion job) and reports how
#    many documents were indexed, updated, removed, or failed.
#
# Runs automatically when a merge to main touches knowledge-base/ (README
# files excepted: they're never uploaded, so they don't need a sync), and
# manually from Actions → "Chatbot knowledge base sync" → Run workflow.
#
# Keep knowledge-base/ changes out of PRs that also change the chatbot's
# Terraform: both workflows start on the same merge, and a sync that runs
# before the apply finishes can fail (e.g. NoSuchBucket on the very first
# apply). Re-running it manually afterwards fixes that.
#
# Authenticates as github-actions-chatbot-kb-sync (infrastructure/aws/
# bootstrap/chatbot_kb.tf): it can write only that bucket and only start and
# watch ingestion jobs. The role trusts only jobs in the `chatbot-kb-sync`
# GitHub Environment.
on:
  push:
    branches: [main]
    paths:
      - "knowledge-base/**"
      - "!knowledge-base/README.md"
      - "!knowledge-base/**/README.md"
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: chatbot-kb-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    environment: chatbot-kb-sync
    env:
      KB_NAME: ae-rv-chatbot-kb
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.AWS_CHATBOT_KB_SYNC_ROLE_ARN }}
          aws-region: us-west-2

      # README.md files explain the folder to people; they aren't knowledge,
      # so they're never uploaded (and --delete removes any strays).
      - name: Mirror knowledge-base/ to the documents bucket
        run: |
          account=$(aws sts get-caller-identity --query Account --output text)
          bucket="ae-rv-chatbot-kb-docs-${account}"
          aws s3 sync knowledge-base/ "s3://${bucket}/" --delete --exclude "*README.md"
          echo "Files in the bucket now:"
          aws s3 ls "s3://${bucket}/" --recursive | awk '{print "  " $4}'

      - name: Start re-index
        id: start
        run: |
          kb_id=$(aws bedrock-agent list-knowledge-bases \
            --query "knowledgeBaseSummaries[?name=='$KB_NAME'].knowledgeBaseId | [0]" --output text)
          ds_id=$(aws bedrock-agent list-data-sources --knowledge-base-id "$kb_id" \
            --query "dataSourceSummaries[0].dataSourceId" --output text)
          job_id=$(aws bedrock-agent start-ingestion-job --knowledge-base-id "$kb_id" \
            --data-source-id "$ds_id" --query ingestionJob.ingestionJobId --output text)
          echo "Started ingestion job $job_id (knowledge base $kb_id, data source $ds_id)"
          {
            echo "kb_id=$kb_id"
            echo "ds_id=$ds_id"
            echo "job_id=$job_id"
          } >> "$GITHUB_OUTPUT"

      - name: Wait for re-index to finish
        env:
          KB_ID: ${{ steps.start.outputs.kb_id }}
          DS_ID: ${{ steps.start.outputs.ds_id }}
          JOB_ID: ${{ steps.start.outputs.job_id }}
        run: |
          for _ in $(seq 1 90); do
            job=$(aws bedrock-agent get-ingestion-job --knowledge-base-id "$KB_ID" \
              --data-source-id "$DS_ID" --ingestion-job-id "$JOB_ID" --output json)
            status=$(echo "$job" | jq -r .ingestionJob.status)
            case "$status" in
              COMPLETE|FAILED|STOPPED) break ;;
            esac
            sleep 10
          done

          stats=$(echo "$job" | jq .ingestionJob.statistics)
          {
            echo "### Knowledge base sync: $status"
            echo
            echo "| Documents | Count |"
            echo "|---|---|"
            echo "| Scanned | $(echo "$stats" | jq .numberOfDocumentsScanned) |"
            echo "| Newly indexed | $(echo "$stats" | jq .numberOfNewDocumentsIndexed) |"
            echo "| Updated | $(echo "$stats" | jq .numberOfModifiedDocumentsIndexed) |"
            echo "| Removed | $(echo "$stats" | jq .numberOfDocumentsDeleted) |"
            echo "| **Failed** | $(echo "$stats" | jq .numberOfDocumentsFailed) |"
          } >> "$GITHUB_STEP_SUMMARY"
          echo "$stats"

          failures=$(echo "$job" | jq -r '.ingestionJob.failureReasons // [] | .[]')
          if [ -n "$failures" ]; then
            printf '\n**Failure reasons:**\n\n```\n%s\n```\n' "$failures" >> "$GITHUB_STEP_SUMMARY"
          fi

          if [ "$status" != "COMPLETE" ] || [ "$(echo "$stats" | jq .numberOfDocumentsFailed)" != "0" ]; then
            echo "::error::Sync finished with status $status. See the summary for failed documents."
            exit 1
          fi
